{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <title>{% block title %}Wiki{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href="{% static 'encyclopedia/styles.css' %}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="sidebar col-lg-2 col-md-3 p-0">
                <div class="p-3">
                    <h2><i class="fa-solid fa-book"></i> Wiki</h2>

                    <div class="search-wrapper">
    <i class="bi bi-search search-icon"></i>
    <input class="search" type="text" name="q" placeholder="Search Encyclopedia">
</div>


                    <nav>
                        <a href="{% url 'index' %}" class="{% if request.path == '/' %}active{% endif %}">
                            <i class="fa-solid fa-house"></i> Home
                        </a>

                        <a href="{% url 'new_page' %}" class="{% if request.path == '/new' %}active{% endif %}">
                            <i class="fa-solid fa-plus"></i> Create New Page
                        </a>

                        <a href="{% url 'random_page' %}" class="{% if request.path == '/random' %}active{% endif %}">
                            <i class="fa-solid fa-shuffle"></i> Random Page
                        </a>

                        {% block nav %}
                        {% endblock %}
                    </nav>
                </div>
            </div>


            <!-- Main Content -->
            <div class="main col-lg-10 col-md-9">
                <div class="content">
                    {% block body %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>

</body>

</html>
